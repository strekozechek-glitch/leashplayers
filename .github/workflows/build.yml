name: Build GuardianAntiCheat JAR

on:
  push:
    branches: [ "arena/fd785ae8-leashplayers", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      run: gradle build

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GuardianAntiCheat-26.2
        path: build/libs/*.jar
